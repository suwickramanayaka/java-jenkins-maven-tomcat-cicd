server {
    listen 8080;
    server_tokens off;
    location = / { return 302 /cicd-demo/; }
    location = /cicd-demo { return 302 /cicd-demo/; }
    location /cicd-demo/ {
        proxy_pass http://tomcat:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
    # Never expose Tomcat Manager through the application's published port.
    location / { return 404; }
}
