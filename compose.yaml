name: java-cicd
services:
  jenkins:
    build: ./infrastructure/jenkins
    restart: unless-stopped
    environment:
      JAVA_OPTS: -Djenkins.install.runSetupWizard=false -Xms256m -Xmx768m
      GIT_REPOSITORY_URL: ${GIT_REPOSITORY_URL:?Run scripts/configure.py first}
      GIT_BRANCH: ${GIT_BRANCH:-main}
      JENKINS_URL: ${JENKINS_URL:-http://localhost:8080/}
    ports:
      - 127.0.0.1:8080:8080
    volumes:
      - jenkins_home:/var/jenkins_home
      - agent_bootstrap:/var/jenkins_home/agent-bootstrap
    secrets:
      - jenkins_admin_password
      - tomcat_password
      - github_username
      - github_token
      - github_ssh_key
    mem_limit: 1200m
    healthcheck:
      test: [CMD-SHELL, 'curl -fsS http://localhost:8080/login > /dev/null']
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  agent:
    build: ./infrastructure/agent
    restart: unless-stopped
    init: true
    depends_on:
      jenkins:
        condition: service_healthy
    environment:
      MAVEN_OPTS: -Xmx512m
    volumes:
      - agent_bootstrap:/run/agent-bootstrap:ro
      - agent_workspace:/home/jenkins/agent
      - maven_cache:/home/jenkins/.m2
    mem_limit: 1500m

  tomcat:
    build: ./infrastructure/tomcat
    restart: unless-stopped
    environment:
      CATALINA_OPTS: -Xms128m -Xmx384m
    secrets:
      - tomcat_password
    volumes:
      - tomcat_apps:/usr/local/tomcat/webapps
    mem_limit: 650m
    healthcheck:
      test: [CMD-SHELL, 'curl -fsS http://localhost:8080/ > /dev/null']
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s

  web:
    image: nginx:1.28.0-alpine
    restart: unless-stopped
    depends_on:
      tomcat:
        condition: service_healthy
    ports:
      - ${APP_BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-8081}:8080
    volumes:
      - type: bind
        source: ./infrastructure/web/default.conf
        target: /etc/nginx/conf.d/default.conf
        read_only: true
    mem_limit: 64m

secrets:
  jenkins_admin_password:
    file: ./.secrets/jenkins_admin_password
  tomcat_password:
    file: ./.secrets/tomcat_password
  github_username:
    file: ./.secrets/github_username
  github_token:
    file: ./.secrets/github_token
  github_ssh_key:
    file: ./.secrets/github_ssh_key

volumes:
  jenkins_home:
  agent_bootstrap:
  agent_workspace:
  maven_cache:
  tomcat_apps:
